<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="navyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C2258"/>
      <stop offset="100%" stop-color="#163A82"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A87C20"/>
      <stop offset="50%" stop-color="#DFB84A"/>
      <stop offset="100%" stop-color="#A87C20"/>
    </linearGradient>
    <linearGradient id="gearFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFB84A"/>
      <stop offset="100%" stop-color="#A87C20"/>
    </linearGradient>
  </defs>

  <!-- Navy square background (browser will clip to rounded rect via CSS) -->
  <rect width="64" height="64" fill="url(#navyBg)" rx="12"/>

  <!-- Shield outline — white -->
  <path d="M32,4 L54,15 L54,37 Q54,53 32,61 Q10,53 10,37 L10,15 Z"
    fill="none" stroke="#FFFFFF" stroke-width="1.6"/>

  <!-- Gold inner shield outline -->
  <path d="M32,8 L51,18 L51,37 Q51,50 32,57 Q13,50 13,37 L13,18 Z"
    fill="none" stroke="url(#goldAccent)" stroke-width="1"/>

  <!-- ── CAR ── -->
  <!-- Chassis -->
  <rect x="14" y="33" width="36" height="10" rx="3.5" fill="#FFFFFF" opacity="0.92"/>
  <!-- Cabin -->
  <path d="M18,33 Q21,25 26,23 L38,23 Q43,25 46,33 Z" fill="#FFFFFF" opacity="0.88"/>
  <!-- Windshield tint -->
  <path d="M21,33 Q23,27 27,25 L37,25 Q41,27 43,33 Z" fill="#0C2258" opacity="0.48"/>
  <!-- Headlight -->
  <rect x="14" y="34" width="6" height="3" rx="1.5" fill="url(#gearFill)" opacity="0.95"/>
  <!-- Tail light -->
  <rect x="44" y="34" width="6" height="3" rx="1.5" fill="url(#gearFill)" opacity="0.75"/>
  <!-- Left wheel -->
  <circle cx="21" cy="43" r="5.5" fill="#040D1A" stroke="#FFFFFF" stroke-width="1.8"/>
  <circle cx="21" cy="43" r="2.2" fill="#FFFFFF" opacity="0.2"/>
  <circle cx="21" cy="43" r="1"   fill="url(#gearFill)"/>
  <!-- Right wheel -->
  <circle cx="43" cy="43" r="5.5" fill="#040D1A" stroke="#FFFFFF" stroke-width="1.8"/>
  <circle cx="43" cy="43" r="2.2" fill="#FFFFFF" opacity="0.2"/>
  <circle cx="43" cy="43" r="1"   fill="url(#gearFill)"/>

  <!-- ── GOLD DIVIDER ── -->
  <line x1="13" y1="49.5" x2="51" y2="49.5" stroke="url(#goldAccent)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- ── GEAR ── -->
  <g transform="translate(32, 57)">
    <path d="
      M-2.8,-8.5 L2.8,-8.5
      L3.8,-6 Q6,-7.2 8,-5.8
      L10.5,-7 L12.5,-3.5 L10,-2
      Q10.5,-0.5 10,1
      L12.5,2.5 L10.5,6 L8,4.8
      Q6,6.5 4,7.2
      L4,9.5 L-0.5,9.5 L-0.5,7.2
      Q-2.5,6.5 -5,4.8
      L-7.5,6 L-9.5,2.5 L-7,1
      Q-7.5,-0.5 -7,-2
      L-9.5,-3.5 L-7.5,-7 L-5,-5.8
      Q-3,-7.2 0,-8 Z"
      fill="url(#gearFill)" opacity="0.95"/>
    <!-- Center hub -->
    <circle cx="0" cy="0" r="3.5" fill="#0C2258"/>
    <circle cx="0" cy="0" r="1.5" fill="url(#goldAccent)" opacity="0.6"/>
  </g>
</svg>
